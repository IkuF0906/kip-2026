<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微分ドリル</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.101.0/dist/mathlive.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <h1>微分ドリル</h1>
    <nav>
      <button class="tab active" data-tab="practice">練習</button>
      <button class="tab" data-tab="review">復習</button>
      <button class="tab" data-tab="stats">成績</button>
    </nav>
  </header>

  <main>
    <section id="drill">
      <div class="toolbar" id="practice-toolbar">
        <label>問題の型
          <select id="type-select"><option value="">ランダム</option></select>
        </label>
        <button id="new-problem">新しい問題</button>
      </div>
      <p class="hint" id="review-hint" hidden>期限が来た型・苦手な型から自動で出題します。</p>

      <div class="card" id="problem-card" hidden>
        <div class="problem-type" id="problem-type"></div>
        <p>次の関数を微分しなさい。</p>
        <div class="problem" id="problem"></div>

        <div class="answer-row">
          <span class="prefix">f'(x) =</span>
          <math-field id="answer-math"></math-field>
          <input id="answer-text" type="text" placeholder="例: 3x^2 + 2sin(x)" hidden>
        </div>
        <div class="answer-actions">
          <button id="submit" class="primary">答え合わせ</button>
          <button id="toggle-input" class="link">テキストで入力する</button>
        </div>
        <p class="error" id="error" hidden></p>
      </div>

      <div class="card" id="result" hidden>
        <div class="verdict" id="verdict"></div>
        <dl class="compare">
          <dt>あなたの答え</dt><dd id="user-answer"></dd>
          <dt>正解</dt><dd id="correct-answer"></dd>
        </dl>
        <div class="diagnosis" id="diagnosis" hidden>
          <h3 id="diag-label"></h3>
          <p id="diag-explanation"></p>
        </div>
        <details id="steps-box">
          <summary>解き方</summary>
          <ol id="steps"></ol>
        </details>
        <p class="next-due" id="next-due"></p>
        <button id="next" class="primary">次の問題</button>
      </div>
    </section>

    <section id="stats" hidden>
      <table>
        <thead>
          <tr><th>型</th><th>解答数</th><th>正答率</th><th>習熟</th><th>次の復習</th><th>多い間違い</th></tr>
        </thead>
        <tbody id="stats-body"></tbody>
      </table>
    </section>
  </main>
</body>
</html>

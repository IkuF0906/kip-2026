# Cloudflare Tunnel（cloudflared）経由のときは、Cloudflare が付ける CF-Connecting-IP を本当の送信元とする。
# 信用するのは Docker のネットワーク内から来たときだけ
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

# cloudflared が付ける X-Forwarded-Proto（https）を引き継ぐ。なければ nginx に来たときの方式
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 答え合わせは SymPy で計算するので重い。1つの IP から送れる回数を制限する
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

upstream app {
    server app:8000;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # 画面は nginx が直接返す。更新がすぐ反映されるよう、毎回変更を確かめさせる
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }
}

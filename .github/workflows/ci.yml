name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # README の「Python 3.10 以上」に合わせ、最小と最新に近い版で確かめる
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # テストが通った main のコミットだけ、イメージを作って GHCR に置く。
  # VM には下の deploy ジョブが入れ替える。PC で Watchtower を動かしていれば、新しい latest に入れ替わる
  publish:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
          - name: nginx
            dockerfile: deploy/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v7
      # Oracle Cloud の Always Free の VM（Ampere A1）は ARM なので、arm64 のイメージも作る
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          # 名前は小文字でなければならない
          tags: |
            ghcr.io/ikuf0906/kip-2026-${{ matrix.name }}:latest
            ghcr.io/ikuf0906/kip-2026-${{ matrix.name }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # イメージを置いたら、Oracle Cloud の VM に SSH で入ってそのコミットの版に入れ替える（push 型）。
  # デプロイ用の鍵は VM 側で deploy.sh しか実行できないので、送るのはコミットのハッシュだけ
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - name: SSH の鍵とホスト鍵を置く
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: デプロイ
        run: ssh ubuntu@${{ vars.DEPLOY_HOST }} "${{ github.sha }}"

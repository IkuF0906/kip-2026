name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # README の「Python 3.10 以上」に合わせ、最小と最新に近い版で確かめる
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # テストが通った main のコミットだけ、イメージを作って GHCR に置く。
  # 動かしている側の Watchtower が新しい latest を見つけて入れ替える
  publish:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
          - name: nginx
            dockerfile: deploy/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # Oracle Cloud の Always Free の VM（Ampere A1）は ARM なので、arm64 のイメージも作る
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          # 名前は小文字でなければならない
          tags: |
            ghcr.io/ikuf0906/kip-2026-${{ matrix.name }}:latest
            ghcr.io/ikuf0906/kip-2026-${{ matrix.name }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

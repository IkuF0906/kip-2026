# 起動: docker compose up -d --build → http://localhost:8080
# インターネットに公開: docker compose --profile tunnel up -d --build → docker compose logs tunnel に URL が出る
services:
  app:
    build: .
    volumes:
      - drill-data:/data
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare Tunnel（アカウントなしの Quick Tunnel）。起動するたびに *.trycloudflare.com の URL が変わる
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped
    profiles: [tunnel]

volumes:
  drill-data:

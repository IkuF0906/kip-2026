# 起動: docker compose up -d → http://localhost:8080（GHCR のイメージを使う。手元のコードで作るときは --build）
# インターネットに公開: --profile tunnel を付ける → docker compose logs tunnel に URL が出る
# main への push で自動更新: --profile autodeploy を付ける（Watchtower が GHCR の新しいイメージに入れ替える）
x-autodeploy: &autodeploy
  com.centurylinklabs.watchtower.enable: "true"

services:
  app:
    image: ghcr.io/ikuf0906/kip-2026-app:latest
    build: .
    volumes:
      - drill-data:/data
    labels: *autodeploy
    restart: unless-stopped

  nginx:
    image: ghcr.io/ikuf0906/kip-2026-nginx:latest
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    labels: *autodeploy
    restart: unless-stopped

  # Cloudflare Tunnel（アカウントなしの Quick Tunnel）。起動するたびに *.trycloudflare.com の URL が変わる
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped
    profiles: [tunnel]

  # 1分ごとに GHCR を見て、ラベルの付いたコンテナ（app・nginx）だけを新しいイメージで作り直す。
  # 元の containrrr/watchtower は開発が終わったので、更新の続いているフォークを使う
  watchtower:
    image: nickfedor/watchtower:latest
    command: --label-enable --interval 60 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    profiles: [autodeploy]

volumes:
  drill-data:
